# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "51f7d1b767795380662d320bff988866"
name = "delivery-scheduler-DEV"
application_url = "https://example.com"
embedded = true

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

  [[webhooks.subscriptions]]
  topics = [ "app/scopes_update" ]
  uri = "/webhooks/app/scopes_update"

  [[webhooks.subscriptions]]
  topics = [ "orders/create" ]
  uri = "/webhooks/orders/create"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes = "read_customers,read_draft_orders,read_files,read_fulfillments,read_merchant_managed_fulfillment_orders,read_metaobjects,read_orders,write_draft_orders,write_files,write_fulfillments,write_merchant_managed_fulfillment_orders,write_metaobject_definitions,write_metaobjects,write_order_edits,write_orders,write_payment_customizations,write_products"

[auth]
redirect_urls = [ "https://example.com/api/auth" ]

[build]
automatically_update_urls_on_dev = true

[sidekick]
extensions_summary = "Delivery Scheduler owns delivery dates, time slots, per-date capacity, blocked dates and reschedules. Data tools answer: an order's delivery date/slot/reschedule status, booked counts vs capacity per date, and the schedule config (cutoff, prep time, slots). Actions open the app where changes are made by hand: an order's delivery panel to reschedule it, or the scheduler on a date to edit capacity/blocked slots. All tools are read-only; actions only navigate."
