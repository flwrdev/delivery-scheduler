# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "192d50677bb4239697e25fd7ad097c50"
name = "delivery-scheduler"
application_url = "https://delivery-scheduler-781645921611.us-central1.run.app"
embedded = true

[build]
automatically_update_urls_on_dev = false

[webhooks]
api_version = "2026-04"

  [[webhooks.subscriptions]]
  topics = [ "app/uninstalled" ]
  uri = "/webhooks/app/uninstalled"

[access_scopes]
# Learn more at https://shopify.dev/docs/apps/tools/cli/configuration#access_scopes
scopes="read_orders,write_orders,read_products,read_customers,read_merchant_managed_fulfillment_orders,write_merchant_managed_fulfillment_orders,write_payment_customizations"
        


[auth]
redirect_urls = [ "https://delivery-scheduler-781645921611.us-central1.run.app/auth/callback", "https://delivery-scheduler-781645921611.us-central1.run.app/auth/shopify/callback", "https://delivery-scheduler-781645921611.us-central1.run.app/api/auth/callback" ]

[app_proxy]
url = "https://delivery-scheduler-299861709433.us-central1.run.app/apps/schedule-rules"
subpath = "schedule-rules"
prefix = "apps"

[order.metafields.app.reschedule_requested_at]
type = "date_time"
name = "Reschedule Requested At"

  [order.metafields.app.reschedule_requested_at.access]
  admin = "merchant_read_write"

[order.metafields.app.reschedule_status]
type = "single_line_text_field"
name = "Reschedule Status"

  [order.metafields.app.reschedule_status.access]
  admin = "merchant_read_write"


