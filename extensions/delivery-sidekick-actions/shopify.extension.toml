[[extensions]]
# Change the merchant-facing name and description of the extension in locales/en.default.json
name = "t:name"
description = "t:description"

handle = "delivery-sidekick-actions"
type = "admin_link"
uid = "9fd582ce-8a1f-988e-4c0d-ece682b5077ad73bfd67"

# Deep links INTO the embedded app. Both URLs are relative to `application_url`
# in shopify.app.toml. Neither target writes anything by itself — they only
# navigate the merchant to the page where the change is made by hand.
# See docs/decisions.md ADR-18.

# ── Intent 1: open one order's delivery panel so the merchant can reschedule ──
# `?order=` opens the details panel on /app/orders (REC-7, URL-driven panel);
# `?search=` filters the list so the order is guaranteed to be in view.
[[extensions.targeting]]
target = "admin.app.intent.link"
url = "/app/orders"
tools = "./tools.json"
instructions = "./instructions.md"

  [[extensions.targeting.intents]]
  # `application/shipment` + `edit` is the closest SUPPORTED intent type for
  # "change when this order is delivered" — intent types are a fixed Shopify
  # enum (shopify/order only supports import/import+bulk, which is the wrong
  # verb). Custom types are rejected at deploy.
  type = "application/shipment"
  action = "edit"
  schema = "./intent-order-reschedule.json"

# ── Intent 2: open the scheduler on a specific delivery date ──
# `?date=` is already the scheduler's day-panel URL state.
[[extensions.targeting]]
target = "admin.app.intent.link"
url = "/app/scheduler"
tools = "./tools.json"
instructions = "./instructions.md"

  [[extensions.targeting.intents]]
  # Same enum constraint; `create` reads as "set up delivery capacity for this
  # date", which is what the day-override panel does.
  type = "application/shipment"
  action = "create"
  schema = "./intent-scheduler-date.json"
