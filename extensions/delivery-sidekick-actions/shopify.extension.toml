[[extensions]]
# Change the merchant-facing name and description of the extension in locales/en.default.json
name = "t:name"
description = "t:description"

handle = "delivery-sidekick-actions"
type = "admin_link"
uid = "9fd582ce-8a1f-988e-4c0d-ece682b5077ad73bfd67"

# Deep link INTO the embedded app, relative to `application_url` in
# shopify.app.toml. Navigation only — nothing is written until the merchant
# acts on the page. See docs/decisions.md ADR-18.
#
# An admin_link extension allows exactly ONE [[extensions.targeting]] block
# (deploy-time validation, caught 2026-08-19) — the scheduler-date intent
# lives in its own sibling extension, delivery-sidekick-scheduler.

# ── Open one order's delivery panel so the merchant can reschedule ──
# `?order=` opens the details panel on /app/orders (REC-7, URL-driven panel);
# `?search=` filters the list so the order is guaranteed to be in view.
[[extensions.targeting]]
target = "admin.app.intent.link"
url = "/app/orders"
tools = "./tools.json"
instructions = "./instructions.md"

  [[extensions.targeting.intents]]
  # `application/shipment` + `edit` is the closest SUPPORTED intent type for
  # "change when this order is delivered" — intent types are a fixed Shopify
  # enum (shopify/order only supports import/import+bulk, which is the wrong
  # verb). Custom types are rejected at deploy.
  type = "application/shipment"
  action = "edit"
  schema = "./intent-order-reschedule.json"
