# Learn more about configuring your checkout UI extension:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/configuration

# The version of APIs your extension will receive. Learn more:
# https://shopify.dev/docs/api/usage/versioning
api_version = "2026-04"

[[extensions]]
name = "Thank You Delivery Schedule"
handle = "delivery-thank-you"
type = "ui_extension"
uid = "44f2b914-bc99-5eb8-57fb-7f587681a1863e539d62"

# Controls where in Shopify your extension will be injected,
# and the file that contains your extension’s source code. Learn more:
# https://shopify.dev/docs/api/checkout-ui-extensions/latest/extension-targets-overview

[[extensions.targeting]]
module = "./src/Checkout.jsx"
target = "purchase.thank-you.block.render"

# NOTE: the COD *totals* live in the separate `cod-fee-notice` extension, whose
# block the merchant positions directly below Shopify's Total in the checkout
# editor. src/OrderSummary.jsx (an earlier attempt at the same thing, from a
# static target ABOVE the Subtotal row) is intentionally NOT registered here.

[[extensions.metafields]]
namespace = "custom"
key = "date"

[[extensions.metafields]]
namespace = "custom"
key = "time_slot"

# COD fee display (merged from the retired cod-fee-notice block).
# Keep in sync with the COD fee product variant price (COD-FEE) and the
# /app/cod-settings fee field — this only controls what the card DISPLAYS.
[extensions.settings]
[[extensions.settings.fields]]
key = "fee_amount"
type = "number_decimal"
name = "COD fee amount"
description = "Displayed COD fee. Must match the COD Fee product price (default 70)."
