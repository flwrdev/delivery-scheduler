query CartPaymentMethodsTransformRunInput {
  cart {
    cost {
      subtotalAmount {
        amount
      }
    }
    deliveryGroups {
      deliveryAddress {
        countryCode
        provinceCode
        city
        zip
      }
    }
  }
  paymentMethods {
    id
    name
  }
  paymentCustomization {
    metafield(namespace: "$app:cod-eligibility", key: "function-configuration") {
      jsonValue
    }
  }
}
