[[extensions]]
# Change the merchant-facing name and description of the extension in locales/en.default.json
name = "t:name"
description = "t:description"

handle = "delivery-sidekick-scheduler"
type = "admin_link"
uid = "4864446f-1578-4ec6-7d6d-bf415798a36dff6b27bd"

# Deep link INTO the embedded app, relative to `application_url` in
# shopify.app.toml. Navigation only — nothing is written until the merchant
# acts on the page. See docs/decisions.md ADR-18.
#
# Sibling of delivery-sidekick-actions (the order-reschedule link) — an
# admin_link extension allows exactly ONE [[extensions.targeting]] block
# (deploy-time validation, caught 2026-08-19), so each deep link is its own
# extension.

# ── Open the scheduler on a specific delivery date ──
# `?date=` is already the scheduler's day-panel URL state (app.scheduler.tsx
# reads it natively — zero app changes were needed).
[[extensions.targeting]]
target = "admin.app.intent.link"
url = "/app/scheduler"
tools = "./tools.json"
instructions = "./instructions.md"

  [[extensions.targeting.intents]]
  # Intent types are a fixed Shopify enum (custom types are rejected at
  # deploy). `application/shipment` + `create` reads as "set up delivery
  # capacity for this date", which is what the day-override panel does.
  type = "application/shipment"
  action = "create"
  schema = "./intent-scheduler-date.json"
