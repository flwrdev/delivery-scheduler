# CI gates — the same four checks run locally before every commit
# (docs/development.md). No DB needed: `prisma generate` is codegen-only.
name: CI

on:
  push:
    branches: [main, "feature/**", "feat/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    env:
      # Placeholder Shopify config so modules that build the app object at
      # import time (app/shopify.server.js) load under vitest. No real values.
      SHOPIFY_APP_URL: https://ci.invalid
      SHOPIFY_API_KEY: ci-placeholder
      SHOPIFY_API_SECRET: ci-placeholder
      SCOPES: read_orders
      # prisma.config.ts resolves these at load time; prisma generate never connects.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      DIRECT_DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # matches the production Dockerfile (node:22-alpine) and package.json engines (>=22.12)
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
