# CI gates — the same four checks run locally before every commit
# (docs/development.md). No DB needed: `prisma generate` is codegen-only.
name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20 # matches the production Dockerfile
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run build
